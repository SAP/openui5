TXT_TOUR_GENERAL_DESCRIPTION=ECtvNjoiU7exmz1Jx8Xl/g_It looks like you haven't used Key User Adaptation before. Would you like to take a tour of the core features now? If you'd prefer to take the tour later, you can start it from the "More Actions" menu at any time.

TIT_TOUR_GENERAL_STEP_UI_ADAPTATION_BUTTON_TITLE=Ed1p8yEQVf2liJ6yDG+ADw_UI Adaptation Mode
TXT_TOUR_GENERAL_STEP_UI_ADAPTATION_BUTTON_DESCRIPTION=IH9XPGIkG2BkMeO4brEP8w_In "UI Adaptation" mode, you make changes to the current screen. You can edit UI elements, adjust configurations, and customize the layout. Direct interaction with the underlying controls is not possible in this mode. To interact with the application, open dialogs, or navigate to other parts of the application, use the "Navigation" mode.

TIT_TOUR_GENERAL_STEP_NAVIGATION_BUTTON_TITLE=95qdutwW5+8omeJ5HPWh5Q_Navigation Mode
TXT_TOUR_GENERAL_STEP_NAVIGATION_BUTTON_DESCRIPTION=hUZK4QNYE13TZNFM8PAJ5Q_The "Navigation" mode enables you to navigate to other parts of the application (for example, from List Report to Object Page) or to open dialogs that you want to adapt. Changes made in this mode are not persisted, and should only be done (for example, by setting a filter) in order to navigate to a different part of the application.

TIT_TOUR_GENERAL_STEP_SAVE_BUTTON_TITLE=sA0RplzSIiRVgw5KFaZnAw_Save Draft
TXT_TOUR_GENERAL_STEP_SAVE_BUTTON_DESCRIPTION=XlEIruYOjuCr6ir8uQ6guQ_Click the "Save" button to save your UI changes. These changes are saved as a draft and aren't visible to end users until you activate them. Other key users can view them in UI Adaptation.

TIT_TOUR_GENERAL_STEP_UNDO_BUTTON_TITLE=qhPANLkcrKZiA1/ncjVV3w_Undo
TXT_TOUR_GENERAL_STEP_UNDO_BUTTON_DESCRIPTION=D1J8ykJ/5oLvVD8sgVzl9Q_This button becomes active when there are unsaved changes. It lets you undo these changes one by one.

TIT_TOUR_GENERAL_STEP_REDO_BUTTON_TITLE=7XbqFbbKLMtaYRAAoXZN/A_Redo
TXT_TOUR_GENERAL_STEP_REDO_BUTTON_DESCRIPTION=o4WXQt5axIhNQbfg9y5fTA_This button becomes active when you press the undo button. It lets you redo the undone changes one by one.

TIT_TOUR_GENERAL_STEP_BACK_BUTTON_TITLE=mTg+kWx33YjZyDyFUdKygA_Navigate Back
TXT_TOUR_GENERAL_STEP_BACK_BUTTON_DESCRIPTION=DEJWhQHWaTAHeN5RDqaDdg_Use this button to navigate back to the previous page. You can only navigate between pages accessed while in Key User Adaptation.

TIT_TOUR_GENERAL_STEP_ACTIVATE_VERSION_BUTTON_TITLE=7hdESFE2PB+e5sxRB9TkZA_Activate New Version
TXT_TOUR_GENERAL_STEP_ACTIVATE_VERSION_BUTTON_DESCRIPTION=OwjOoFtz3J2AHUAHJjLqgw_Click the "Activate New Version" button to save the current draft changes as a new version. This action makes the changes visible to end users.

TIT_TOUR_GENERAL_STEP_HIGHLIGHT_ALL_CHANGES_BUTTON_TITLE=/4u3jTqevscs9CHcbZC+Dg_Highlight All App Changes
TXT_TOUR_GENERAL_STEP_HIGHLIGHT_ALL_CHANGES_BUTTON_DESCRIPTION=ToZXs5iT1wxEUWNWnGXkuw_Click the "Highlight All App Changes" button to view all changes, including both draft and an overview of all changes currently active in the app.

TIT_TOUR_GENERAL_STEP_VERSIONS_DROPDOWN_TITLE=ef0Lkuy+1E+3cDjThVTwPg_Version Actions
TXT_TOUR_GENERAL_STEP_VERSIONS_DROPDOWN_DESCRIPTION=tzDzGoy52/Y3S6H0QIUpnw_This menu displays all actions related to versions.

TIT_TOUR_GENERAL_STEP_PUBLISH_BUTTON_TITLE=vng4ZYmE29NkYyoHxjGbzw_Publish Versions
TXT_TOUR_GENERAL_STEP_PUBLISH_BUTTON_DESCRIPTION=bkdeeVaF25yQOxxpzMxlTQ_Create UI Adaptations in a test system first. After verifying them, publish them to productive systems. This button becomes active if there are active versions that haven't been transported yet.

TIT_TOUR_GENERAL_STEP_DISCARD_BUTTON_TITLE=ONzkrv83ItNjr5qAHpjaSA_Discard Draft
TXT_TOUR_GENERAL_STEP_DISCARD_BUTTON_DESCRIPTION=5Ws9EwXcD6Z5hag+jsWyjQ_Click the "Discard Draft" button to delete the current draft. All unsaved changes will be lost.

TIT_TOUR_GENERAL_STEP_MANAGE_VERSIONS_BUTTON_TITLE=UyDFshxEcsuDgAndUDrCNw_Manage All Versions
TXT_TOUR_GENERAL_STEP_MANAGE_VERSIONS_BUTTON_DESCRIPTION=AomV5sWfC7v800Fbdk7nMg_Open the "Manage All Versions" dialog for an overview of all available versions and navigate between them.

TIT_TOUR_GENERAL_STEP_BURGER_MENU_TITLE=B29fwzHqz9qcLQ9oYnyE4w_More Actions
TXT_TOUR_GENERAL_STEP_BURGER_MENU_DESCRIPTION=CoKBceuOVrwln9A6AciGjg_This menu displays additional actions, such as an overview of new features in RTA, an overview of app variants, and options for key users to translate modified textual elements. The available actions depend on the system you're using and the roles you're assigned to. The following actions are currently available\:
TXT_TOUR_GENERAL_STEP_BURGER_MENU_TRANSLATIONS=PX+dGmKk9zlB7mU+E4+Q7g_When adapting the UI, you or other key users can rename UI texts. If you want to translate these UI texts into other languages, export the source-language texts first. Then import the translated texts.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_APP_VARIANTS=YcRGeAyEJuGAXC8ezFix7g_You can create variants of apps. These app variants are apps that are based on UI changes that key users make during UI adaptation.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_RESTORE=g5/RfMCNBd5X0DNAVgbphA_The restore action lets you revert the application to it's original state without any changes.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_NEW_FEATURES=gloamb5nxWzO1yc6EG+vvg_The "What's New" lists the new features in UI Adaptation, including those introduced in previous versions.
TXT_TOUR_GENERAL_STEP_BURGER_MENU_GENERAL_TOUR=7g7xrJ/JSLJ9sykCZMIZEg_You can start the UI Adaptation Tour anytime from the "More Actions" menu.


TIT_TOUR_GENERAL_STEP_CONTEXT_BASED_ADAPTATIONS_TITLE=4mGwN31xWxXGfFxPfAi85Q_Adapting the UI for specific roles
TXT_TOUR_GENERAL_STEP_CONTEXT_BASED_ADAPTATIONS_DESCRIPTION=xK9+3dqHV/1TE+AjQMJx7Q_You can customize the user interfaces of apps individually for specific user roles. For more information please review our <a href\="https\://help.sap.com/docs/FLP/124fa121c8674dce903cee2ff62b9c63/969cc16ff13e46c1b28001cc5e7189e0.html" target\="_blank">documentation</a>.

TIT_TOUR_GENERAL_STEP_FEEDBACK_BUTTON_TITLE=TTOW+8eqQr6m/IWY1bXzmA_Feedback
TXT_TOUR_GENERAL_STEP_FEEDBACK_BUTTON_DESCRIPTION=gFlDTfMrgCtqKuO2oNUtLQ_This lets you provide feedback specifically on the UI Adaptation mode.

TIT_TOUR_GENERAL_STEP_EXIT_BUTTON_TITLE=R2UD7i9DN7oiQky35wWi9g_Exit UI Adaptation
TXT_TOUR_GENERAL_STEP_EXIT_BUTTON_DESCRIPTION=RZCKsAJ5U6exUrPZc6cC9Q_When you have finished making your UI changes, use the "Exit" button to return to your app.


BTN_LEARN_MORE_WHATS_NEW_DIALOG=loXnofwfpZyJerNTgvFKMg_Learn More
BTN_BACK_WHATS_NEW_OVERVIEW_DIALOG=JqPiQAL03MavayacrJ0QoA_Back
TXT_DONT_SHOW_AGAIN_WHATS_NEW_DIALOG=pjS4DYMPtXdlT2T7+J6pJA_Do not show again
TIT_WHATS_NEW_DIALOG=QUnr3LLtV2mjy45wfm/mhg_What's New in Key User Adaptation
TIT_WHATS_NEW_DIALOG_OVERVIEW=maU412gEkJ/FCcfzNlDIYw_Overview of New Features

TIT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_TITLE=LEgBkm3H2SuAL1tJHE5PZw_"What's New" for Key Users
TXT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_DESCRIPTION=KIrHKuzc7lxhDovJ7Qjmzg_Introducing our "What's New" dialog - stay updated on the latest features and improvements
TXT_WHATS_NEW_DIALOG_WHATS_NEW_FEATURE_TEXT=Ea6nWQQU9/OMUws/s9B/WA_We're excited to introduce our "What's New" dialog. This dialog will keep you informed about the latest updates, features, and improvements in key user adaptation. Stay up-to-date with all the new functions and enhancements designed to improve your (key) user experience.
TXT_WHATS_NEW_DIALOG_WHATS_NEW_OVERVIEW_TEXT=5qaZ7+21Xb+hlpldijq/TA_After an upgrade, we will automatically show the new features introduced with the new version. If you're interested in features from previous versions, you can find an overview through the toolbar's menu icon.

TIT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_TITLE=n2vswhzEVY3k+DS88aecMw_Harmonized Context Menu
TXT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_DESCRIPTION=DuB4eXEEabe1Fc7NAGCVFQ_The context menu style is now consistent when you select elements.
TXT_WHATS_NEW_DIALOG_MINIMENU_REMOVAL_TEXT=SxFdtbgR+SeVuv4EheCLJQ_The context menu no longer differs based on how you select an element, such as using the left or right mouse button. The familiar right-click context menu now also appears when you left-click an element.

TIT_WHATS_NEW_LAZY_LOADING_TITLE=IZGooK97SBzj5ILY+nAeYQ_Improved Performance for Views
TXT_WHATS_NEW_DIALOG_LAZY_LOADING_DESCRIPTION=6yprC43WbSuSu7jZMD+YKA_Applications with many views now load faster due to lazy loading of view data.
TXT_WHATS_NEW_DIALOG_LAZY_LOADING_TEXT=3K4Vqn0vkQyQmrsEmagdoQ_Views can now be loaded on demand, which means your applications start faster when many views are available. This performance improvement works automatically and requires no configuration.

TIT_WHATS_NEW_CBA_CF_TITLE=96+aWSK7TCFR1hlptkfDkA_Adapting UIs for Specific Roles
TXT_WHATS_NEW_DIALOG_CBA_CF_DESCRIPTION=txOEvW6pbKmzJPKl9ndiGw_Customize UIs for different user roles - without creating separate application variants.
TXT_WHATS_NEW_DIALOG_CBA_CF_TEXT=YP8fIiA7UIjDjcdU7SYvDA_Save your UI changes as an adaptation and assign it to one or more roles. Users who open the app see a different UI based on their roles. No additional tiles are needed.
TXT_WHATS_NEW_DIALOG_CBA_CF_TEXT_2=GmC+0iz6iryMwBxujA3JBA_When a user has multiple roles with different adaptations, priorities determine which adaptation is shown. Assign a priority to each adaptation to control the experience for users with overlapping roles.

TIT_WHATS_NEW_RTA_TOUR_TITLE=TMYr+x8WD2mlAYeJppop9w_UI Adaptation Tour
TXT_WHATS_NEW_DIALOG_RTA_TOUR_DESCRIPTION=EbvMs333BwDVznkGUHs5Rg_The UI Adaptation Tour offers an overview of all core features of UI Adaptation.
TXT_WHATS_NEW_DIALOG_RTA_TOUR_TEXT=mRyLkruLsmRC0DkAOUL0tQ_The UI Adaptation Tour provides an overview of all core features of UI Adaptation. To start the tour, open the "More Actions" menu and select "UI Adaptation Tour".

TIT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TITLE=FkRcII+ATXEk9IT/z6uduw_Embedded Content Sandbox Customization
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_DESCRIPTION=UpI1oTeYxzHc2XyD9dQC+A_You can now adjust sandbox properties in the Define Embedded Content dialog under Advanced Settings.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT=MJ8q5kI31xyVgAIDgP2WNw_You can now customize the properties of the Embedded Content sandbox when adding or editing embedded content.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT_2=Fe6D6mpJPwcETWbKjwYxeQ_In the <strong>Advanced Settings</strong> section, you can now change the sandbox properties according to your use case. The properties <strong>allow-forms</strong>, <strong>allow-scripts</strong>, and <strong>allow-same-origin</strong> are enabled by default for new Embedded Content, providing a sensible default for most applications.
TXT_WHATS_NEW_DIALOG_IFRAME_SANDBOX_TEXT_3=oML2KL6ezrQUZE8hsz+ibA_If your use case requires further sandbox permissions, please refer to the <a href\="https\://developer.mozilla.org/en-US/docs/Web/HTML/Element/iframe\#sandbox" target\="_blank">documentation</a>.

TIT_WHATS_NEW_RENAME_REWORK_TITLE=bAJoqVrXKmS3KpLamysvjw_Rename Rework
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_DESCRIPTION=OGVUqaqKmI2+cEOFsSmDmg_We have made some changes to the rename functionality in UI Adaptation.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_1=K8ApeXReFC8TmRn+fGod0A_The process for renaming textual elements has been improved. Each rename action now opens a dialog. Many texts support renaming the underlying property, so changes made this way are visible throughout the application wherever this text appears.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_2=ydUTs4kV1+zHYSF9XbnW9Q_For example, a field might be present in a filter bar as a filter, in the corresponding table as a column, and as a field in the detail page's form control. Renaming one of these entries, e.g., by selecting "Change Labels" in the filter bar, will also affect the column of the table and the form's field.
TXT_WHATS_NEW_DIALOG_RENAME_REWORK_TEXT_3=B9szkCeSwVlnIZ7rIyTXKw_You can rename fields in a form individually by selecting the "Rename" action. To see the effects of these changes, you need to restart the application. If you make such a change, the toolbar includes a button that restarts the application for you and automatically enters UI adaptation mode.

TIT_WHATS_NEW_TEXT_ARRANGEMENT_TITLE=dIUxOgxsKrYO2tfxu4fV8Q_Change Text Arrangement
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_DESCRIPTION=jf1kCbKqXwbFPkxcLsCj5Q_Key users can now change the display behavior of texts that support this feature.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_1=3LPGilqa3iQIm5KUYmiryw_Most applications now support changing the text arrangement or display behavior of their fields. FilterBar, most Tables, and Forms include a "Change Text Arrangement" action. This feature lets key users decide if fields should be represented by their ID, their textual representation, or both.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_2=EAwXfhGRcxO1jb266Xfvtg_This change applies to the underlying property, so you can observe the desired display behavior wherever the property's text is used. It's not just the control used to create this change that's affected.
TXT_WHATS_NEW_DIALOG_TEXT_ARRANGEMENT_TEXT_3=eQ/9xel0ObicmK/YgWHfVA_To see the effect of these changes, you need to restart the application. If you create such a change, the toolbar contains a button that restarts the application for you and automatically enters UI adaptation.

TIT_WHATS_NEW_EXTENDED_ACTIONS_TITLE=/LfPEB4P0aF+TMq/naZwag_Extended Actions
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_DESCRIPTION=SI5OOz3XmcJ41kk90PaENw_Important actions are now presented more centrally.
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_TEXT_1=NqWhpg31ImTqoFH0OWG8XA_Certain actions are of central importance for their respective controls and should also be accessible from their sub-controls.
TXT_WHATS_NEW_DIALOG_EXTENDED_ACTIONS_TEXT_2=Haa15mhGr26t5/0MPj3Rbg_When working with a table for example, key users should always be able to access the table settings directly, even when selecting the toolbar or a column. These actions will be propagated to the context menu of child controls, so they are always just one click away. The control and its propagated actions can be found in the "Extended Actions" section at the bottom of the context menu.
